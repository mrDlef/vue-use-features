name: Release

# Publishing is driven by tags: `git tag v0.3.0 && git push --tags`.
# The tag must match the version in package.json — the job fails otherwise
# rather than publishing something mislabelled.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance: the OIDC token is what lets npm attest
      # that this tarball was built by this workflow from this commit.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Lint
        run: pnpm run lint:check

      - name: Check formatting
        run: pnpm run format:check

      - name: Test on Vue 2 and Vue 3
        run: pnpm run test:ci

      - name: Build
        run: pnpm run build

      - name: Check build output
        run: pnpm run test:dist

      # `npm publish` rather than `pnpm publish`: provenance is an npm CLI
      # feature and pnpm does not forward the flag.
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
