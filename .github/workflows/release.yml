name: Release

# Publishing is driven by tags: `git tag v0.3.0 && git push --tags`.
# The tag must match the version in package.json — the job fails otherwise
# rather than publishing something mislabelled.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for trusted publishing: the OIDC token is what authenticates
      # this workflow to npm, and what lets npm attest provenance. There is no
      # npm token anywhere — npmjs.com trusts this repo + workflow filename.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # Node 24, not 22: trusted publishing needs npm >= 11.5.1 and Node 22
      # still bundles npm 10.9.x. The check below fails loudly if that ever
      # regresses, since otherwise it only surfaces at publish time.
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Check npm supports trusted publishing
        run: |
          need=11.5.1
          have="$(npm --version)"
          echo "npm $have"
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" != "$need" ]; then
            echo "npm $have is too old for trusted publishing; need >= $need" >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Lint
        run: pnpm run lint:check

      - name: Check formatting
        run: pnpm run format:check

      - name: Test on Vue 2 and Vue 3
        run: pnpm run test:ci

      - name: Build
        run: pnpm run build

      - name: Check build output
        run: pnpm run test:dist

      # `npm publish` rather than `pnpm publish`: trusted publishing is an npm
      # CLI feature. No `--provenance` — it is implied by trusted publishing,
      # and no credentials, which is the whole point.
      #
      # Requires a trusted publisher on npmjs.com for this package, pointing at
      # mrDlef/vue-use-features and the workflow filename `release.yml`.
      # Renaming this file breaks publishing until npm is updated to match.
      - name: Publish to npm
        run: npm publish --access public
